<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/">
      <i class="bi bi-people-fill me-2"></i>
      Employee Management
    </a>

    <a routerLink="/" class="btn btn-outline-light btn-sm">
      <i class="bi bi-house me-1"></i>
      Home
    </a>
  </div>
</nav>

@if (notification.message()) {
  <div
    class="alert alert-{{ notification.type() }} alert-dismissible fade show notification-alert shadow-sm"
    role="alert">
    <i
      class="bi me-2"
      [class.bi-check-circle-fill]="notification.type() === 'success'"
      [class.bi-exclamation-triangle-fill]="notification.type() === 'danger'"></i>
    {{ notification.message() }}
    <button
      type="button"
      class="btn-close"
      aria-label="Close notification"
      (click)="notification.dismiss()"></button>
  </div>
}
