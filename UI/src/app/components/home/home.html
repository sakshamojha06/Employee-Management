<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">

    <div>
      <h2 class="fw-bold">Employee List</h2>
      <p class="text-muted mb-0">Manage your employees</p>
    </div>

    <a routerLink="/add" class="btn btn-primary">
      <i class="bi bi-person-plus-fill me-2"></i>
      Add Employee
    </a>

  </div>

  <div class="card shadow-sm border-0">

    <div class="card-body">

      <div class="table-responsive">

        <table class="table table-hover align-middle">

          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Age</th>
              <th>Department</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody>

            @for (employee of employees(); track employee.id; let i = $index) {

              <tr>
                <td>{{ i + 1 }}</td>
                <td class="fw-semibold">{{ employee.name }}</td>
                <td>{{ employee.email }}</td>
                <td>{{ employee.age }}</td>
                <td>
                  <span class="badge bg-info text-dark">
                    {{ employee.department }}
                  </span>
                </td>

                <td>
                  <a
                    [routerLink]="['/edit', employee.id]"
                    class="btn btn-sm btn-outline-primary me-2">
                    <i class="bi bi-pencil-square"></i>
                  </a>

                  <button
                    class="btn btn-sm btn-outline-danger"
                    (click)="deleteEmployee(employee.id)">
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>

            } @empty {

              <tr>
                <td colspan="6" class="text-center text-muted py-4">
                  No employees found.
                </td>
              </tr>

            }

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>
